# TradeAnalytics — Data Source Configuration
# Shared provider settings across ALL streams
# Change provider here — affects daily, intraday, and tick equally

sources:
  primary: ibkr           # kept for backward compat — first in priority list
  fallback: yahoo         # kept for backward compat — last resort
  priority:               # tried in order until one passes health_check()
    - ibkr                # Client Portal REST — local Mac only (localhost:5055)
    - ibinsync            # IB Gateway socket — EC2 proxy (54.197.158.82:4002)
    - polygon             # cloud-friendly historical — add POLYGON_API_KEY to use
    - yahoo               # last resort — unofficial, no API key required

  ibkr:
    gateway_mode: ec2         # local | ec2  — change this one line to switch gateway
    gateways:
      local:
        base_url: https://localhost:5055/v1/api
      ec2:
        base_url: http://54.197.158.82:4002/v1/api
    verify_ssl: false
    timeout_seconds: 30
    max_retries: 3
    retry_delay_seconds: 2
    account_id: ""              # injected from .env (IBKR_ACCOUNT_ID)
    username: ""                # injected from .env (IBKR_USERNAME)
    password: ""                # injected from .env (IBKR_PASSWORD)

  ibinsync:
    gateway_mode: ec2           # local | ec2  — change this one line to switch gateway
    client_id: 10               # IB Gateway client ID (1-32; use different IDs for simultaneous connections)
    timeout_seconds: 30
    gateways:
      local:
        host: 127.0.0.1
        port: 4002              # IB Gateway paper port (4001 = live)
      ec2:
        host: 54.197.158.82
        port: 4004              # IB Gateway paper port on EC2 (gnzsnz image uses 4004)

  yahoo:
    timeout_seconds: 30
    max_retries: 2
    retry_delay_seconds: 5

  polygon:                      # Future — Phase 5 if needed
    base_url: https://api.polygon.io/v2
    timeout_seconds: 30
    max_retries: 3
    retry_delay_seconds: 2
    api_key: ""                 # injected from .env (POLYGON_API_KEY)

  provider_fallback:
    enabled: true
    max_retries: 3
    retry_delay_seconds: 30
    fallback_on_empty: true     # fall back if provider returns empty data
    fallback_on_error: true     # fall back if provider raises exception
