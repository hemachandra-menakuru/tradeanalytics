bundle:
  name: tradeanalytics

variables:
  env:
    description: Deployment environment
    default: dev
  pipeline_version:
    description: Pipeline version for audit trail — override at deploy time with git SHA
    default: "unknown"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-46a555ac-7f7b.cloud.databricks.com
      profile: handh-trade-aws
    variables:
      env: dev

resources:
  jobs:
    fetch_planner:
      name: "[${var.env}] Fetch Planner (Two-Plane)"
      description: "Derives per-instrument fetch plans and emits control.fetch_request rows + S3 manifests for the EC2 bridge agent. CLAUDE.md §14."

      # No schedule yet — manual runs only until the full three-chunk pipeline
      # (planner → EC2 agent → ingestion) is proven end-to-end. Then re-add:
      #   quartz_cron_expression: "0 0 19 ? * MON-FRI"  (7pm ET Mon-Fri)
      #   timezone_id: "America/New_York"

      email_notifications:
        on_failure:
          - handh.stocks@gmail.com

      tasks:
        - task_key: fetch_planner
          notebook_task:
            notebook_path: "notebooks/control/fetch_planner.py"
            base_parameters:
              symbols:     ""          # blank = all active instruments
              dry_run:     "false"
              as_of_date:  ""
              environment: "${var.env}"
          environment_key: serverless_env
          timeout_seconds: 1800
          max_retries: 1

      max_concurrent_runs: 1

      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - pyyaml
              - python-dotenv
      tags:
        project:    tradeanalytics
        layer:      control
        phase:      "3"
        managed_by: dabs

    raw_to_bronze:
      name: "[${var.env}] Raw to Bronze Ingestion (Two-Plane)"
      description: "Reconciles agent receipts, ingests landed raw payloads into Bronze, updates watermarks and job_run_log. CLAUDE.md §14 Stage 4."

      # Manual runs until proven end-to-end; then schedule ~1h after the planner
      # (e.g. "0 0 21 ? * MON-FRI" America/New_York) or a file-arrival trigger.

      email_notifications:
        on_failure:
          - handh.stocks@gmail.com

      tasks:
        - task_key: raw_to_bronze
          notebook_task:
            notebook_path: "notebooks/bronze/raw_to_bronze.py"
            base_parameters:
              dry_run:          "false"
              vendor:           "ibkr"
              execute:          "true"     # Job path runs; interactive "Run all" stays gated (execute=false)
              environment:      "${var.env}"
              pipeline_version: "${var.pipeline_version}"
          environment_key: serverless_env
          timeout_seconds: 3600
          max_retries: 0

      max_concurrent_runs: 1

      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - pyyaml
              - python-dotenv
      tags:
        project:    tradeanalytics
        layer:      bronze
        phase:      "3"
        managed_by: dabs

    bronze_daily_ingestion:
      name: "[${var.env}] Bronze Daily Ingestion (DEV TOOL — superseded)"
      description: "⚠ SUPERSEDED by fetch_planner + EC2 agent + raw_to_bronze (CLAUDE.md §14). Dev/ad-hoc only, and only from a LOCAL Mac run — as a cloud job it cannot reach IBKR (no serverless egress) and the production-provider guard will fail it rather than fall back to yahoo."

      schedule:
        quartz_cron_expression: "0 0 19 * * ?"
        timezone_id: "America/New_York"
        pause_status: PAUSED

      email_notifications:
        on_failure:
          - handh.stocks@gmail.com

      tasks:
        - task_key: bronze_daily_ingestion
          description: "Run Bronze ingestion for daily stream"
          notebook_task:
            notebook_path: "notebooks/bronze/bronze_daily_ingestion.py"
            base_parameters:
              symbols:    "SPY"           # smoke test — 1 symbol only
              dry_run:    "false"
              as_of_date: ""             # empty = today
              start_date: "2026-06-16"  # smoke test: Mon only (2 days max)
              end_date:   "2026-06-17"  # smoke test: Mon-Tue = 2 records
              environment:       "${var.env}"
              pipeline_version:  "${var.pipeline_version}"
          environment_key: serverless_env
          timeout_seconds: 3600
          retry_on_timeout: false
          max_retries: 0                  # no retries during smoke test

      # Serverless-only decision (2026-06-30): no classic job clusters.
      # Dependencies must mirror requirements-serverless.txt (source of truth).
      # Note: serverless has no spark_env_vars — ENVIRONMENT and PIPELINE_VERSION
      # are passed as notebook base_parameters instead (see task above).
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - pyyaml
              - python-dotenv
              - ib_insync
              - yfinance
      tags:
        project:    tradeanalytics
        layer:      bronze
        stream:     daily
        phase:      "2"
        managed_by: dabs

    universe_sync:
      name: "[${var.env}] Reference Universe Sync"
      description: "Monthly job — syncs instrument universe from NASDAQ FTP + ETF holdings into reference tables"

      schedule:
        quartz_cron_expression: "0 0 6 1 * ?"   # 6am UTC on the 1st of each month
        timezone_id: "UTC"
        pause_status: PAUSED                      # unpause when reference tables are ready

      email_notifications:
        on_failure:
          - handh.stocks@gmail.com

      tasks:
        - task_key: universe_sync
          description: "Sync instrument universe into reference.instrument + feed_config"
          notebook_task:
            notebook_path: "notebooks/reference/02_universe_sync.py"
            base_parameters:
              dry_run:      "true"    # set to false when ready for first production run
              etf_only:     "false"
              skip_ibkr:    "true"    # always true in cloud — IBKR gateway on localhost only
              openfigi_key: ""
          environment_key: serverless_env
          timeout_seconds: 7200     # 2 hours — OpenFIGI enrichment for 10k instruments
          retry_on_timeout: false
          max_retries: 1

      # Serverless-only decision (2026-06-30): no classic job clusters.
      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - pyyaml
              - python-dotenv
              - yfinance
      tags:
        project:    tradeanalytics
        layer:      reference
        phase:      "2.5"
        managed_by: dabs
